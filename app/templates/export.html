{% extends "base.html" %}

{% block title %}Export - Weld Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <h2 class="mb-4">Export to Excel</h2>

        <div class="card">
            <div class="card-body">
                <form action="{{ url_for('export.export_excel') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Inspection Type</label>
                        <select name="inspection_type" class="form-select">
                            <option value="">All Types</option>
                            <option value="VT">VT - Visual Testing</option>
                            <option value="UT">UT - Ultrasonic Testing</option>
                        </select>
                    </div>

                    <div class="row mb-3">
                        <div class="col">
                            <label class="form-label">Date From</label>
                            <input type="date" name="date_from" class="form-control">
                        </div>
                        <div class="col">
                            <label class="form-label">Date To</label>
                            <input type="date" name="date_to" class="form-control">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Project (search)</label>
                        <input type="text" name="project" class="form-control" placeholder="Enter project name...">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Result</label>
                        <select name="result" class="form-select">
                            <option value="">All Results</option>
                            <option value="Accept">Accepted</option>
                            <option value="Reject">Rejected</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-success">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-file-earmark-spreadsheet me-1" viewBox="0 0 16 16">
                            <path d="M14 14V4.5L9.5 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2M9.5 3A1.5 1.5 0 0 0 11 4.5h2V9H3V2a1 1 0 0 1 1-1h5.5zM3 12v-2h2v2zm0 1h2v2H4a1 1 0 0 1-1-1zm3 2v-2h3v2zm4 0v-2h3v1a1 1 0 0 1-1 1zm3-3h-3v-2h3zm-7 0v-2h3v2z"/>
                        </svg>
                        Download Excel
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
